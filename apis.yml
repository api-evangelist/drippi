name: Drippi
description: Drippi (trydrippi.com) was a New York City-based platform that helped young
  content creators navigate the complexities of running their creator businesses. The
  company has been acquired and has closed its service to both current and new customers,
  directing its community to Instagram (@trydrippi) for future updates. It does not publish
  a public API, developer portal, or SDKs. NOTE FOR ENRICHMENT — this entity is distinct
  from the similarly named drippi.ai, a separate, bootstrapped Twitter/X cold-outreach DM
  automation SaaS (founded 2021 by Alex Penunuri, no venture funding); do not attach
  drippi.ai's API artifacts to this Bloomberg Beta portfolio profile.
